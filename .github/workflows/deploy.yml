name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: UI

      - name: Checkout WGPUI
        uses: actions/checkout@v4
        with:
          repository: Far-Beyond-Pulsar/WGPUI
          path: WGPUI

      - name: Checkout WGPUI-Component
        uses: actions/checkout@v4
        with:
          repository: Far-Beyond-Pulsar/WGPUI-Component
          path: WGPUI-Component

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            UI/target/wasm-cache
          key: wasm-${{ runner.os }}-${{ hashFiles('UI/scripts/build-examples.js', 'UI/scripts/build-component-wasm.js') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install dependencies
        run: npm ci
        working-directory: UI

      - name: Build site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /UI
        working-directory: UI

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: UI/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
